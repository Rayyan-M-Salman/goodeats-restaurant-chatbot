
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Restaurant Assistant</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f5f1;
            color: #24352a;
        }

        .chat-container {
            width: min(720px, 100%);
            height: 100dvh;
            margin: auto;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.06);
        }

        header {
            background: #244c36;
            color: white;
            padding: 22px 24px;
        }

        header h1 {
            font-size: 23px;
            margin: 0 0 7px;
        }

        header p {
            font-size: 14px;
            margin: 0;
            color: #d7e7dc;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px 18px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 85%;
            padding: 12px 15px;
            border-radius: 15px;
            line-height: 1.55;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .bot {
            align-self: flex-start;
            background: #edf2ed;
            border-bottom-left-radius: 4px;
        }

        .user {
            align-self: flex-end;
            background: #244c36;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 16px;
            border-top: 1px solid #e2e8e2;
        }

        #question {
            flex: 1;
            min-width: 0;
            padding: 14px;
            font-size: 16px;
            border: 1px solid #ccd7cd;
            border-radius: 10px;
            outline: none;
        }

        #question:focus {
            border-color: #477b58;
        }

        #send {
            padding: 0 22px;
            border: none;
            border-radius: 10px;
            background: #244c36;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        #send:disabled {
            opacity: 0.55;
            cursor: wait;
        }

        .status {
            padding: 0 18px 10px;
            font-size: 12px;
            color: #657468;
        }

        @media (max-width: 480px) {
            header {
                padding: 18px;
            }

            #messages {
                padding: 18px 12px;
            }

            .input-area {
                padding: 12px;
            }

            #send {
                padding: 0 15px;
            }
        }
    </style>
</head>

<body>
    <main class="chat-container">
        <header>
            <h1 id="restaurant-name">Good Eats Restaurant Assistant</h1>
            <p>Ask us about our menu, prices, and opening hours.</p>
        </header>

        <section
            id="messages"
            aria-label="Chat messages"
            aria-live="polite"
        >
            <div class="message bot">
            Hello! Welcome to the Good Eats restaurant.

            How can I help you today?
            </div>
        </section>

        <div class="status" id="status">
            Your assistant runs locally on this computer.
        </div>

        <form class="input-area" id="chat-form">
            <input
                id="question"
                type="text"
                placeholder="Ask a question..."
                autocomplete="off"
                aria-label="Your message"
                required
            >

            <button id="send" type="submit">Send</button>
        </form>
    </main>

    <script>
        const messagesElement =
            document.getElementById("messages");

        const form =
            document.getElementById("chat-form");

        const input =
            document.getElementById("question");

        const sendButton =
            document.getElementById("send");

        const statusElement =
            document.getElementById("status");

        // Store recent conversation messages for follow-up questions.
        const history = [];

        function addMessage(text, role) {
            const bubble = document.createElement("div");

            bubble.className = "message " + role;

            // textContent prevents model output from being interpreted
            // as HTML.
            bubble.textContent = text;

            messagesElement.appendChild(bubble);

            messagesElement.scrollTop =
                messagesElement.scrollHeight;

            return bubble;
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const question = input.value.trim();

            if (!question || sendButton.disabled) {
                return;
            }

            addMessage(question, "user");

            history.push({
                role: "user",
                content: question
            });

            input.value = "";
            input.disabled = true;
            sendButton.disabled = true;

            statusElement.textContent = "Generating response...";

            const thinkingBubble =
                addMessage("Thinking...", "bot");

            try {
                const response = await fetch("/chat", {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        messages: history
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.error || "The request failed."
                    );
                }

                thinkingBubble.textContent = data.reply;

                history.push({
                    role: "assistant",
                    content: data.reply
                });

                statusElement.textContent =
                    "Your assistant runs locally on this computer.";

            } catch (error) {
                thinkingBubble.textContent =
                    "Sorry, I couldn't get a response. " +
                    error.message;

                // Remove the failed question from the history so
                // the user can retry without a broken conversation.
                history.pop();

                statusElement.textContent =
                    "Check that Flask and Ollama are running.";

            } finally {
                input.disabled = false;
                sendButton.disabled = false;
                input.focus();
            }
        });
    </script>
</body>
</html>
